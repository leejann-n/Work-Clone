<!-- 업무 메일 화면 (담당: PM) -->
<div class="run-head">
  <strong class="run-name">업무 메일</strong>
  <span class="mode-badge" data-el="count"></span>
  <div class="ml-actions">
    <button type="button" class="btn-primary sm" data-el="compose-btn"><i data-icon="send" data-size="14"></i> 새 메일</button>
  </div>
</div>
<div class="fp-body">
  <div class="fp-grid ml-grid">
    <section class="card ml-side">
      <div class="ml-tabs">
        <button type="button" class="on" data-box="inbox">받은 메일함</button>
        <button type="button" data-box="sent">보낸 메일함</button>
      </div>
      <ul class="ml-list" data-el="list"><li class="empty">불러오는 중…</li></ul>
    </section>
    <section class="card ml-main" data-el="main">
      <div class="empty ml-empty">왼쪽에서 메일을 고르세요.</div>
    </section>
  </div>
</div>
